<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BABEL // TERMINAL</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="terminal">

        <div class="scanlines"></div>

        <header>
            <div class="system-title">
                BABEL // TERMINAL DE ACESSO
            </div>

            <div class="system-status">
                SISTEMA: <span>ONLINE</span>
            </div>
        </header>

        <main id="terminal-output">

            <div class="boot">
                <p>INICIALIZANDO TERMINAL...</p>
                <p>CARREGANDO SISTEMA BABEL...</p>
                <p>VERIFICANDO CONEXÃO...</p>
                <p>CONEXÃO ESTABELECIDA.</p>
                <br>
                <p>TERMINAL DE ACESSO RESTRITO</p>
                <p>Digite <strong>ajuda</strong> para consultar os comandos disponíveis.</p>
            </div>

        </main>

        <div class="input-area">

            <span class="prompt">&gt;</span>

            <input
                type="text"
                id="commandInput"
                autocomplete="off"
                autofocus
                spellcheck="false"
            >

        </div>

        <footer>
            BABEL SCIENTIFIC DIVISION // ANGEL ENGINE INITIATIVE
        </footer>

    </div>

    <script src="script.js"></script>

</body>
</html>
